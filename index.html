<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Catch</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 24, 39, 0.95);
            --border-color: rgba(139, 92, 246, 0.4);
            --primary-glow: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #d1d5db;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            gap: 12px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
        }

        .app-title {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, #c084fc, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .drop-rates {
            display: flex;
            gap: 6px;
        }

        .rate-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .rate-badge.legendary { color: #f59e0b; border-color: rgba(245, 158, 11, 0.5); }
        .rate-badge.epic { color: #ec4899; border-color: rgba(236, 72, 153, 0.5); }
        .rate-badge.rare { color: #3b82f6; border-color: rgba(59, 130, 246, 0.5); }

        .sound-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        /* Summon Section */
        .summon-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .summon-btn {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: transform 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .summon-btn:active {
            transform: scale(0.98);
        }
        .summon-btn:disabled {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }
        .summon-status {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Shareable Card Container (Все внутри единого блока для скриншота со score) */
        .card-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rarity-tag {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            background: rgba(139, 92, 246, 0.25);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.5);
        }
        .rarity-tag.legendary { color: #f59e0b; background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.5); }
        .rarity-tag.epic { color: #ec4899; background: rgba(236, 72, 153, 0.2); border-color: rgba(236, 72, 153, 0.5); }
        .rarity-tag.rare { color: #3b82f6; background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); }
        .rarity-tag.common { color: #9ca3af; background: rgba(156, 163, 175, 0.2); border-color: rgba(156, 163, 175, 0.5); }

        .item-box {
            height: 110px;
            background: rgba(0, 0, 0, 0.35);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .empty-slot-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pixel Avatar (Scaled Up) */
        .pixel-avatar {
            display: grid;
            grid-template-columns: repeat(5, 14px);
            grid-template-rows: repeat(5, 14px);
            gap: 2px;
        }
        .pixel {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }
        .pixel.on {
            background: #ec4899;
            box-shadow: 0 0 8px #ec4899;
        }
        .pixel.alt {
            background: #8b5cf6;
            box-shadow: 0 0 6px #8b5cf6;
        }
        .pixel.gold {
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 2px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .stat-item span {
            display: block;
            font-weight: 900;
            font-size: 15px;
            color: #fff;
            margin-top: 2px;
        }

        /* Total Power Score inside the card */
        .power-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.15));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .power-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 800;
        }
        .power-value {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.6);
            margin: 2px 0;
        }
        .power-breakdown {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-around;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 6px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Watermark Tag for Screenshot */
        .card-watermark {
            text-align: right;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: -2px;
        }

        /* Share Button */
        .share-btn {
            width: 100%;
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s ease;
        }
        .share-btn:active {
            background: rgba(59, 130, 246, 0.3);
        }
    </style>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- html2canvas for image generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        window.initialDropData = null;
        window.isAlreadyClaimed = false;

        (function() {
            const CURRENT_VERSION = '2.6'; 
            const savedVersion = localStorage.getItem('app_version');

            if (savedVersion !== CURRENT_VERSION) {
                localStorage.removeItem('daily_drop_last_claim');
                localStorage.removeItem('drop_avatar');
                localStorage.removeItem('drop_rarity');
                localStorage.removeItem('drop_rarityClass');
                localStorage.removeItem('drop_str');
                localStorage.removeItem('drop_dex');
                localStorage.removeItem('drop_int');
                localStorage.removeItem('drop_luck');
                localStorage.removeItem('drop_combat');
                localStorage.removeItem('drop_luckScore');
                localStorage.removeItem('drop_bonus');
                localStorage.removeItem('drop_total');
                
                localStorage.setItem('app_version', CURRENT_VERSION);
            }

            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate === today) {
                window.isAlreadyClaimed = true;
                const avatar = localStorage.getItem('drop_avatar');
                const rarityText = localStorage.getItem('drop_rarity');
                const rarityClass = localStorage.getItem('drop_rarityClass');
                const str = localStorage.getItem('drop_str');
                const dex = localStorage.getItem('drop_dex');
                const int = localStorage.getItem('drop_int');
                const luck = localStorage.getItem('drop_luck');
                const combat = localStorage.getItem('drop_combat');
                const luckScore = localStorage.getItem('drop_luckScore');
                const rarityBonus = localStorage.getItem('drop_bonus');
                const totalPower = localStorage.getItem('drop_total');

                if (avatar && rarityText) {
                    window.initialDropData = {
                        avatar, rarityText, rarityClass, str, dex, int, luck, combat, luckScore, rarityBonus, totalPower
                    };
                }
            }
        })();
    </script>
</head>
<body>

    <div class="main-content">
        <div class="top-bar">
            <div class="app-title">Daily Catch</div>
            <div class="drop-rates">
                <span class="rate-badge legendary">👑 0.5%</span>
                <span class="rate-badge epic">🔮 3%</span>
                <span class="rate-badge rare">💎 21.5%</span>
            </div>
            <button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔊</button>
        </div>

        <div class="summon-box">
            <script>
                if (window.isAlreadyClaimed) {
                    document.write(`<button class="summon-btn" id="summonBtn" disabled>SUMMON</button>`);
                    document.write(`<div class="summon-status" id="summonStatus">Calculating time...</div>`);
                } else {
                    document.write(`<button class="summon-btn" id="summonBtn" onclick="triggerSummon()">SUMMON</button>`);
                    document.write(`<div class="summon-status" id="summonStatus">Ready to summon!</div>`);
                }
            </script>
        </div>

        <!-- Карточка целиком (включая Score) для правильного скриншота -->
        <div class="card-container">
            <div class="item-header">
                <script>
                    if (window.initialDropData) {
                        document.write(`<span class="rarity-tag ${window.initialDropData.rarityClass}" id="itemRarity">${window.initialDropData.rarityText}</span>`);
                    } else {
                        document.write(`<span class="rarity-tag common" id="itemRarity">No Drop Yet</span>`);
                    }
                </script>
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 650;">Drop Slot</span>
            </div>
            
            <div class="item-box" id="itemDisplay">
                <script>
                    if (window.initialDropData) {
                        document.write(window.initialDropData.avatar);
                    } else {
                        document.write('<span class="empty-slot-text">Empty Slot</span>');
                    }
                </script>
            </div>

            <div class="stats-grid">
                <div class="stat-item">STR <span id="statStr"><script>document.write(window.initialDropData ? window.initialDropData.str : '0');</script></span></div>
                <div class="stat-item">DEX <span id="statDex"><script>document.write(window.initialDropData ? window.initialDropData.dex : '0');</script></span></div>
                <div class="stat-item">INT <span id="statInt"><script>document.write(window.initialDropData ? window.initialDropData.int : '0');</script></span></div>
                <div class="stat-item">LUCK <span id="statLuck"><script>document.write(window.initialDropData ? window.initialDropData.luck : '0');</script></span></div>
            </div>

            <div class="power-box">
                <div class="power-label">Total Power Score</div>
                <div class="power-value" id="totalPower"><script>document.write(window.initialDropData ? window.initialDropData.totalPower : '0');</script></div>
                <div class="power-breakdown">
                    <span>Combat: <strong id="breakdownCombat"><script>document.write(window.initialDropData ? window.initialDropData.combat : '0');</script></strong></span>
                    <span>Luck: <strong id="breakdownLuck"><script>document.write(window.initialDropData ? window.initialDropData.luckScore : '0');</script></strong></span>
                    <span>Bonus: <strong id="breakdownBonus"><script>document.write(window.initialDropData ? window.initialDropData.rarityBonus : '0');</script></strong></span>
                </div>
            </div>

            <div class="card-watermark">@Daily_Catch_Bot</div>
        </div>

        <button class="share-btn" onclick="shareToTelegram()">📤 Share Drop</button>
    </div>

    <script>
        let soundEnabled = true;
        let audioCtx = null;

        function generateRandomAvatar() {
            let html = '<div class="pixel-avatar">';
            const types = ['', 'on', 'alt', 'gold'];
            for (let i = 0; i < 25; i++) {
                const cls = types[Math.floor(Math.random() * types.length)];
                html += `<div class="pixel ${cls}"></div>`;
            }
            html += '</div>';
            return html;
        }

        function rollRarity() {
            const rand = Math.random() * 100;
            if (rand < 0.5) {
                return { name: 'Legendary Apex', cssClass: 'legendary', bonus: 2500 };
            } else if (rand < 3.5) {
                return { name: 'Epic Cyber Core', cssClass: 'epic', bonus: 1000 };
            } else if (rand < 25.0) {
                return { name: 'Rare Quantum Item', cssClass: 'rare', bonus: 300 };
            } else {
                return { name: 'Common Drop', cssClass: 'common', bonus: 0 };
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq, type, duration) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇';
            playBeep(440, 'sine', 0.1);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.isAlreadyClaimed) {
                updateCountdown();
                setInterval(updateCountdown, 1000);
            }
        });

        function applyDataToUI(data) {
            document.getElementById('itemDisplay').innerHTML = data.avatar;
            
            const rarityTag = document.getElementById('itemRarity');
            rarityTag.innerText = data.rarityText;
            rarityTag.className = `rarity-tag ${data.rarityClass}`;

            document.getElementById('statStr').innerText = data.str;
            document.getElementById('statDex').innerText = data.dex;
            document.getElementById('statInt').innerText = data.int;
            document.getElementById('statLuck').innerText = data.luck;

            document.getElementById('breakdownCombat').innerText = data.combat;
            document.getElementById('breakdownLuck').innerText = data.luckScore;
            document.getElementById('breakdownBonus').innerText = data.rarityBonus;
            document.getElementById('totalPower').innerText = data.totalPower;
        }

        function lockSummonButton() {
            const btn = document.getElementById('summonBtn');
            btn.disabled = true;
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('summonStatus').innerText = 
                `Next drop in ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function triggerSummon() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate === today) return;

            playBeep(587.33, 'triangle', 0.15);
            setTimeout(() => playBeep(880, 'sine', 0.3), 150);

            const str = Math.floor(Math.random() * 201) + 50;   
            const dex = Math.floor(Math.random() * 201) + 50;   
            const int = Math.floor(Math.random() * 201) + 50;   
            const luck = Math.floor(Math.random() * 91) + 10;   
            
            const rolled = rollRarity();
            const avatarHTML = generateRandomAvatar();

            const combat = (str + dex + int) * 15;
            const luckScore = luck * 40;
            const totalPower = combat + luckScore + rolled.bonus;

            const dropData = {
                avatar: avatarHTML,
                rarityText: rolled.name,
                rarityClass: rolled.cssClass,
                str: str,
                dex: dex,
                int: int,
                luck: luck,
                combat: combat,
                luckScore: luckScore,
                rarityBonus: rolled.bonus,
                totalPower: totalPower
            };

            applyDataToUI(dropData);

            localStorage.setItem('daily_drop_last_claim', today);
            localStorage.setItem('drop_avatar', avatarHTML);
            localStorage.setItem('drop_rarity', rolled.name);
            localStorage.setItem('drop_rarityClass', rolled.cssClass);
            localStorage.setItem('drop_str', str);
            localStorage.setItem('drop_dex', dex);
            localStorage.setItem('drop_int', int);
            localStorage.setItem('drop_luck', luck);
            localStorage.setItem('drop_combat', combat);
            localStorage.setItem('drop_luckScore', luckScore);
            localStorage.setItem('drop_bonus', rolled.bonus);
            localStorage.setItem('drop_total', totalPower);

            lockSummonButton();
        }

        async function shareToTelegram() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate !== today) {
                alert('Make a summon first before sharing your drop!');
                return;
            }

            const cardElement = document.querySelector('.card-container');
            const botUrl = 'https://t.me/Daily_Catch_Bot';
            const total = document.getElementById('totalPower').innerText;
            const rarity = document.getElementById('itemRarity').innerText;
            
            const shareText = `🔥 My Daily Catch Drop!\n🏆 Rarity: ${rarity}\n⚡ Total Power: ${total}\n\n👉 Get yours in @Daily_Catch_Bot: ${botUrl}`;

            try {
                const canvas = await html2canvas(cardElement, {
                    backgroundColor: '#0b0f19',
                    scale: 2,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Failed to generate image.');
                        return;
                    }

                    const file = new File([blob], 'daily-drop.png', { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            // Передаем картинку вместе с текстом в одном вызове, чтобы телеграм не разбивал это на 2 сообщения
                            await navigator.share({
                                files: [file],
                                text: shareText
                            });
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.log('Share error:', err);
                            }
                        }
                    } else {
                        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                            window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(shareText)}`);
                        } else {
                            alert('Sharing images as files is not supported on this device/browser.');
                        }
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Screenshot error:', error);
                alert('Could not create drop image.');
            }
        }
    </script>
</body>
</html>
