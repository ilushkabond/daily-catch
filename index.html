<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Catch — Ultimate Edition</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #070913;
            --card-bg: rgba(16, 20, 35, 0.85);
            --border-color: rgba(139, 92, 246, 0.3);
            --primary-glow: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(139, 92, 246, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
            gap: 12px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 700;
        }

        .app-title {
            font-size: 19px;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #f43f5e, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.4));
        }

        .drop-rates {
            display: flex;
            gap: 6px;
        }

        .rate-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
        }
        .rate-badge.legendary { color: #f59e0b; border-color: rgba(245, 158, 11, 0.5); text-shadow: 0 0 8px rgba(245,158,11,0.5); }
        .rate-badge.epic { color: #ec4899; border-color: rgba(236, 72, 153, 0.5); text-shadow: 0 0 8px rgba(236,72,153,0.5); }
        .rate-badge.rare { color: #3b82f6; border-color: rgba(59, 130, 246, 0.5); }

        .sound-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sound-btn:active {
            transform: scale(0.9);
        }

        /* Interactive Clicker Box (Dopamine Generator) */
        .clicker-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(139, 92, 246, 0.05);
        }

        .clicker-target {
            width: 120px;
            height: 120px;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clicker-target img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.7));
            transition: filter 0.3s;
        }
        .clicker-target:hover img {
            filter: drop-shadow(0 0 24px rgba(236, 72, 153, 0.9));
        }
        .clicker-target:active {
            transform: scale(0.88);
        }

        @keyframes boxShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-4px, 1px) rotate(-3deg); }
            40% { transform: translate(4px, -2px) rotate(3deg); }
            60% { transform: translate(-2px, 3px) rotate(0deg); }
            80% { transform: translate(3px, -1px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake {
            animation: boxShake 0.25s ease-in-out;
        }

        @keyframes bouncePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            70% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .bounce-effect {
            animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
            transition: width 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .clicker-status {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Holographic Card Container (tilt removed, only cursor shine remains) */
        .card-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.18) 0%,
                rgba(139, 92, 246, 0.08) 35%,
                transparent 70%
            );
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 3;
        }
        .card-container:hover::before {
            opacity: 1;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .rarity-tag {
            font-size: 12px;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }
        .rarity-tag.legendary { color: #f59e0b; background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.6); box-shadow: 0 0 16px rgba(245, 158, 11, 0.4); animation: pulseGlow 2s infinite alternate; }
        .rarity-tag.epic { color: #ec4899; background: rgba(236, 72, 153, 0.2); border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 0 16px rgba(236, 72, 153, 0.4); }
        .rarity-tag.rare { color: #3b82f6; background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.6); }
        .rarity-tag.common { color: #9ca3af; background: rgba(156, 163, 175, 0.15); border-color: rgba(156, 163, 175, 0.3); }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.03); filter: brightness(1.2); }
        }

        .multiplier-badge {
            font-size: 12px;
            font-weight: 800;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .item-box {
            height: 130px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .empty-slot-text {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pixel Avatar Grid — now reflects quality within rarity via inline styles */
        .pixel-avatar {
            display: grid;
            grid-template-columns: repeat(5, 20px);
            grid-template-rows: repeat(5, 20px);
            gap: 2px;
            animation: floatAvatar 4s ease-in-out infinite alternate;
        }
        @keyframes floatAvatar {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-4px) rotate(1deg); }
        }
        .pixel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            transition: background 0.3s;
        }

        .quality-note {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            z-index: 2;
        }

        /* Formula details breakdown */
        .formula-breakdown {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 9px 12px;
            border-radius: 10px;
            z-index: 2;
        }
        .formula-breakdown span {
            color: #fff;
        }

        /* Mega Power Box */
        .power-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(236, 72, 153, 0.18));
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }
        .power-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 900;
        }
        .power-value {
            font-size: 30px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 16px rgba(139, 92, 246, 0.8);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Footer info */
        .card-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            z-index: 2;
        }
        .card-bot-link {
            font-size: 11px;
            color: #c084fc;
            font-weight: 900;
        }
        .card-watermark {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 800;
            letter-spacing: 0.8px;
        }

        /* Share Button */
        .share-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .share-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }
    </style>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- html2canvas for image generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    
    <script>
        window.initialDropData = null;
        window.isAlreadyClaimed = false;

        (function() {
            const CURRENT_VERSION = '5.1'; 
            const savedVersion = localStorage.getItem('app_version');

            if (savedVersion !== CURRENT_VERSION) {
                localStorage.removeItem('daily_drop_last_claim');
                localStorage.removeItem('drop_avatar');
                localStorage.removeItem('drop_rarity');
                localStorage.removeItem('drop_rarityClass');
                localStorage.removeItem('drop_base');
                localStorage.removeItem('drop_multiplier');
                localStorage.removeItem('drop_power');
                localStorage.removeItem('drop_quality');
                
                localStorage.setItem('app_version', CURRENT_VERSION);
            }

            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate === today) {
                window.isAlreadyClaimed = true;
                const avatar = localStorage.getItem('drop_avatar');
                const rarityText = localStorage.getItem('drop_rarity');
                const rarityClass = localStorage.getItem('drop_rarityClass');
                const base = localStorage.getItem('drop_base') || '0';
                const multiplier = localStorage.getItem('drop_multiplier') || '1.0';
                const power = localStorage.getItem('drop_power') || '0';
                const quality = localStorage.getItem('drop_quality') || '0';

                if (avatar && rarityText) {
                    window.initialDropData = { avatar, rarityText, rarityClass, base, multiplier, power, quality };
                }
            }
        })();
    </script>
</head>
<body>

    <div class="main-content">
        <div class="top-bar">
            <div class="app-title">Daily Catch</div>
            <div class="drop-rates">
                <span class="rate-badge legendary">👑 2%</span>
                <span class="rate-badge epic">🔮 8%</span>
                <span class="rate-badge rare">💎 25%</span>
            </div>
            <button class="sound-btn" id="soundToggle" onclick="toggleSound()" title="Toggle Sound">🔊</button>
        </div>

        <!-- Dopamine Clicker Box -->
        <div class="clicker-box" id="clickerBox">
            <div class="clicker-target" id="clickTarget" onclick="handleLootClick(event)">
                <img src="lootbox.png" alt="Lootbox" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><circle cx='60' cy='60' r='50' fill='%238b5cf6'/><text x='60' y='68' text-anchor='middle' fill='white' font-size='38' font-weight='bold' style='font-family:sans-serif'>?</text></svg>'">
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="clicker-status" id="clickerStatus">Tap box to open drop!</div>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="item-header">
                <script>
                    if (window.initialDropData) {
                        document.write(`<span class="rarity-tag ${window.initialDropData.rarityClass}" id="itemRarity">${window.initialDropData.rarityText}</span>`);
                        document.write(`<span class="multiplier-badge" id="multiplierBadge">⚡ x${window.initialDropData.multiplier} Mult</span>`);
                    } else {
                        document.write(`<span class="rarity-tag common" id="itemRarity">No Drop Yet</span>`);
                        document.write(`<span class="multiplier-badge" id="multiplierBadge">⚡ x1.0 Mult</span>`);
                    }
                </script>
            </div>
            
            <div class="item-box" id="itemDisplay">
                <script>
                    if (window.initialDropData) {
                        document.write(window.initialDropData.avatar);
                    } else {
                        document.write('<span class="empty-slot-text">Empty Slot</span>');
                    }
                </script>
            </div>

            <div class="quality-note" id="qualityNote">
                <script>
                    document.write(window.initialDropData ? `Quality: ${window.initialDropData.quality}% within category` : 'Quality: —');
                </script>
            </div>

            <div class="formula-breakdown" id="formulaBreakdown">
                <script>
                    if (window.initialDropData) {
                        document.write(`<span>Base:</span> ${Number(window.initialDropData.base).toLocaleString()} &nbsp;×&nbsp; <span>Mult:</span> ${window.initialDropData.multiplier}`);
                    } else {
                        document.write(`<span>Base:</span> 0 &nbsp;×&nbsp; <span>Mult:</span> 1.0`);
                    }
                </script>
            </div>

            <div class="power-box">
                <div class="power-label">Total Power Score</div>
                <div class="power-value" id="totalPower"><script>document.write(window.initialDropData ? Number(window.initialDropData.power).toLocaleString() : '0');</script></div>
            </div>

            <div class="card-footer-info">
                <span class="card-bot-link">t.me/Daily_Catch_Bot</span>
                <span class="card-watermark">Daily Drop</span>
            </div>
        </div>

        <button class="share-btn" onclick="shareToTelegram()">📤 Share Drop</button>
    </div>

    <script>
        let soundEnabled = true;
        let audioCtx = null;
        let clicksRemaining = 10;
        const totalClicksNeeded = 10;

        // Ranges must match the formulas used in rollRarity() below
        const RARITY_INFO = {
            common:    { min: 1000,  max: 4499,   color: '156,163,175' }, // grey
            rare:      { min: 5000,  max: 14999,  color: '59,130,246'  }, // blue
            epic:      { min: 20000, max: 49999,  color: '236,72,153'  }, // pink
            legendary: { min: 75000, max: 199999, color: '245,158,11'  }  // gold
        };

        // Generates the 5x5 pixel grid, but density/brightness reflect
        // how good this base roll is *within its own rarity's range*.
        function generateAvatarForRarity(cssClass, basePower) {
            const info = RARITY_INFO[cssClass] || RARITY_INFO.common;
            let quality = (basePower - info.min) / (info.max - info.min);
            quality = Math.max(0, Math.min(1, quality));

            let html = '<div class="pixel-avatar">';
            for (let i = 0; i < 25; i++) {
                // chance a cell lights up scales with quality
                const litChance = 0.15 + quality * 0.75;
                if (Math.random() < litChance) {
                    // brightness of a lit cell also scales with quality (+ a little noise)
                    const intensity = Math.min(1, 0.4 + quality * 0.55 + Math.random() * 0.15);
                    const glow = (3 + quality * 11).toFixed(0);
                    html += `<div class="pixel" style="background: rgba(${info.color}, ${intensity.toFixed(2)}); box-shadow: 0 0 ${glow}px rgba(${info.color}, ${(intensity * 0.85).toFixed(2)});"></div>`;
                } else {
                    html += '<div class="pixel"></div>';
                }
            }
            html += '</div>';

            return { html, quality: Math.round(quality * 100) };
        }

        function rollRarity() {
            const rand = Math.random() * 100;
            if (rand < 2.0) {
                const base = Math.floor(Math.random() * 125000) + 75000; // 75000-199999
                return { name: 'Legendary Apex', cssClass: 'legendary', basePower: base };
            } else if (rand < 10.0) {
                const base = Math.floor(Math.random() * 30000) + 20000; // 20000-49999
                return { name: 'Epic Cyber Core', cssClass: 'epic', basePower: base };
            } else if (rand < 35.0) {
                const base = Math.floor(Math.random() * 10000) + 5000; // 5000-14999
                return { name: 'Rare Quantum Item', cssClass: 'rare', basePower: base };
            } else {
                const base = Math.floor(Math.random() * 3500) + 1000; // 1000-4499
                return { name: 'Common Drop', cssClass: 'common', basePower: base };
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playCrackSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playVictorySound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, index) => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.12, now + index * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + index * 0.07);
                    osc.stop(now + index * 0.07 + 0.3);
                } catch(e) {}
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Particle Burst Effect on Click
        function createParticleBurst(x, y) {
            const count = 22;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '7px';
                particle.style.height = '7px';
                particle.style.borderRadius = '50%';
                const colors = ['#ec4899', '#8b5cf6', '#38bdf8', '#f59e0b'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                particle.style.boxShadow = `0 0 8px ${particle.style.backgroundColor}`;
                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 90 + 25;
                const destinationX = Math.cos(angle) * speed;
                const destinationY = Math.sin(angle) * speed;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 350,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
        }

        // Holographic shine follows cursor — no tilt/rotation
        const cardContainer = document.getElementById('cardContainer');
        cardContainer.addEventListener('mousemove', (e) => {
            const rect = cardContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            cardContainer.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
            cardContainer.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
        });

        cardContainer.addEventListener('mouseleave', () => {
            cardContainer.style.setProperty('--mouse-x', '50%');
            cardContainer.style.setProperty('--mouse-y', '50%');
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (window.isAlreadyClaimed) {
                lockClickerUI();
                updateCountdown();
                setInterval(updateCountdown, 1000);
            } else {
                updateProgressUI();
            }
        });

        function updateProgressUI() {
            const percentage = (clicksRemaining / totalClicksNeeded) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('clickerStatus').innerText = `Tap box: ${clicksRemaining} left`;
        }

        function handleLootClick(event) {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();
            if (lastClaimDate === today || clicksRemaining <= 0) return;

            clicksRemaining--;
            playCrackSound();
            createParticleBurst(event.clientX, event.clientY);

            const target = document.getElementById('clickTarget');
            target.classList.remove('shake');
            void target.offsetWidth; 
            target.classList.add('shake');

            updateProgressUI();

            if (clicksRemaining === 0) {
                triggerSummon();
            }
        }

        function lockClickerUI() {
            const box = document.getElementById('clickerBox');
            box.style.opacity = '0.65';
            document.getElementById('clickTarget').style.pointerEvents = 'none';
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('clickerStatus').innerText = 
                `Next drop in ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function triggerSummon() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();
            if (lastClaimDate === today) return;

            playVictorySound();

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#8b5cf6', '#ec4899', '#f59e0b', '#38bdf8']
                });
            }

            const rolled = rollRarity();
            const { html: avatarHTML, quality } = generateAvatarForRarity(rolled.cssClass, rolled.basePower);

            const randomMultiplier = (Math.random() * 2.0 + 1.0).toFixed(1);
            const finalPower = Math.floor(rolled.basePower * parseFloat(randomMultiplier));

            document.getElementById('itemDisplay').innerHTML = avatarHTML;
            document.getElementById('qualityNote').innerText = `Quality: ${quality}% within category`;

            const rarityTag = document.getElementById('itemRarity');
            rarityTag.innerText = rolled.name;
            rarityTag.className = `rarity-tag ${rolled.cssClass}`;
            
            document.getElementById('multiplierBadge').innerText = `⚡ x${randomMultiplier} Mult`;
            document.getElementById('formulaBreakdown').innerHTML = `<span>Base:</span> ${rolled.basePower.toLocaleString()} &nbsp;×&nbsp; <span>Mult:</span> ${randomMultiplier}`;
            document.getElementById('totalPower').innerText = finalPower.toLocaleString();

            const card = document.getElementById('cardContainer');
            card.classList.add('bounce-effect');
            setTimeout(() => card.classList.remove('bounce-effect'), 400);

            localStorage.setItem('daily_drop_last_claim', today);
            localStorage.setItem('drop_avatar', avatarHTML);
            localStorage.setItem('drop_rarity', rolled.name);
            localStorage.setItem('drop_rarityClass', rolled.cssClass);
            localStorage.setItem('drop_base', rolled.basePower);
            localStorage.setItem('drop_multiplier', randomMultiplier);
            localStorage.setItem('drop_power', finalPower);
            localStorage.setItem('drop_quality', quality);

            lockClickerUI();
        }

        async function shareToTelegram() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate !== today) {
                alert('Open your drop first before sharing!');
                return;
            }

            const cardElement = document.querySelector('.card-container');
            const botUrl = 'https://t.me/Daily_Catch_Bot';

            try {
                const canvas = await html2canvas(cardElement, {
                    backgroundColor: '#070913',
                    scale: 2,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Failed to generate image.');
                        return;
                    }

                    const file = new File([blob], 'daily-drop.png', { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            // Image only — no accompanying share text
                            await navigator.share({ files: [file] });
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.log('Share error:', err);
                            }
                        }
                    } else {
                        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                            window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}`);
                        } else {
                            alert('Sharing images as files is not supported on this device/browser.');
                        }
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Screenshot error:', error);
                alert('Could not create drop image.');
            }
        }
    </script>
</body>
</html>
