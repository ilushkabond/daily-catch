<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Catch — Ultimate Edition</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #070913;
            --card-bg: rgba(16, 20, 35, 0.85);
            --border-color: rgba(139, 92, 246, 0.3);
            --primary-glow: #8b5cf6;
            --accent-pink: #ec4899;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(139, 92, 246, 0.22) 0%, transparent 55%),
                radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding: 8px;
            max-width: 480px;
            margin: 0 auto;
            gap: 8px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            gap: 6px;
        }

        .app-title {
            font-size: 15px;
            font-weight: 900;
            background: linear-gradient(135deg, #c084fc, #f43f5e, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(192, 132, 252, 0.4));
        }

        .drop-rates {
            display: flex;
            gap: 4px;
        }

        .rate-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 9px;
            font-weight: 800;
        }
        .rate-badge.legendary { color: #f59e0b; border-color: rgba(245, 158, 11, 0.5); text-shadow: 0 0 8px rgba(245,158,11,0.5); }
        .rate-badge.epic { color: #ec4899; border-color: rgba(236, 72, 153, 0.5); text-shadow: 0 0 8px rgba(236,72,153,0.5); }
        .rate-badge.rare { color: #3b82f6; border-color: rgba(59, 130, 246, 0.5); }

        .icon-btn-group {
            display: flex;
            gap: 5px;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            font-size: 13px;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .sound-btn:active {
            transform: scale(0.9);
        }

        /* Big clicker — only visible before today's drop is claimed */
        .clicker-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(139, 92, 246, 0.05);
        }
        .clicker-box.hidden {
            display: none;
        }

        .clicker-target {
            width: 96px;
            height: 96px;
            cursor: pointer;
            position: relative;
            transition: transform 0.05s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clicker-target img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.7));
            transition: filter 0.3s;
        }
        .clicker-target:hover img {
            filter: drop-shadow(0 0 24px rgba(236, 72, 153, 0.9));
        }
        .clicker-target:active {
            transform: scale(0.88);
        }

        @keyframes boxShake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-4px, 1px) rotate(-3deg); }
            40% { transform: translate(4px, -2px) rotate(3deg); }
            60% { transform: translate(-2px, 3px) rotate(0deg); }
            80% { transform: translate(3px, -1px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake {
            animation: boxShake 0.25s ease-in-out;
        }

        @keyframes bouncePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            70% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .bounce-effect {
            animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }
        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
            transition: width 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .clicker-status {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Compact bar — only visible after today's drop is claimed */
        .next-drop-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }
        .next-drop-bar.hidden {
            display: none;
        }
        .next-drop-bar span#nextDropTimer {
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .card-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }
        .card-container.hidden {
            display: none;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rarity-tag {
            font-size: 10px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.4);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.2);
        }
        .rarity-tag.legendary { color: #f59e0b; background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.6); box-shadow: 0 0 16px rgba(245, 158, 11, 0.4); animation: pulseGlow 2s infinite alternate; }
        .rarity-tag.epic { color: #ec4899; background: rgba(236, 72, 153, 0.2); border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 0 16px rgba(236, 72, 153, 0.4); }
        .rarity-tag.rare { color: #3b82f6; background: rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.6); }
        .rarity-tag.common { color: #9ca3af; background: rgba(156, 163, 175, 0.15); border-color: rgba(156, 163, 175, 0.3); }

        @keyframes pulseGlow {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.03); filter: brightness(1.2); }
        }

        .multiplier-badge {
            font-size: 10px;
            font-weight: 800;
            color: #f43f5e;
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 3px 7px;
            border-radius: 8px;
        }

        .item-box {
            height: 88px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .empty-slot-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pixel-avatar {
            display: grid;
            grid-template-columns: repeat(5, 14px);
            grid-template-rows: repeat(5, 14px);
            gap: 2px;
            animation: floatAvatar 4s ease-in-out infinite alternate;
        }
        @keyframes floatAvatar {
            0% { transform: translateY(-2px) rotate(-1deg); }
            100% { transform: translateY(2px) rotate(1deg); }
        }
        .pixel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            transition: background 0.3s;
        }

        .quality-note {
            font-size: 10px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 0.4px;
        }
        .quality-note .tier-label {
            text-transform: uppercase;
        }
        .quality-note .tier-pct {
            color: var(--text-muted);
            font-weight: 700;
        }

        .formula-breakdown {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 9px;
            border-radius: 10px;
        }
        .formula-breakdown span {
            color: #fff;
        }

        .power-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(236, 72, 153, 0.18));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .power-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            font-weight: 900;
        }
        .power-value {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 16px rgba(139, 92, 246, 0.8);
            margin-top: 1px;
            letter-spacing: 0.5px;
        }

        .card-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 5px;
        }
        .card-bot-link {
            font-size: 9px;
            color: #c084fc;
            font-weight: 900;
        }
        .card-watermark {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 800;
            letter-spacing: 0.8px;
        }

        .share-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 11px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
        }
        .share-btn.hidden {
            display: none;
        }
        .share-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        /* Feedback modal */
        .feedback-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .feedback-overlay.hidden { display: none; }

        .feedback-modal {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .feedback-title {
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .feedback-textarea {
            width: 100%;
            min-height: 90px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-main);
            padding: 10px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
        }
        .feedback-actions {
            display: flex;
            gap: 8px;
        }
        .feedback-cancel, .feedback-send {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
        }
        .feedback-cancel {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }
        .feedback-send {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
        }
        .feedback-send:disabled { opacity: 0.5; cursor: not-allowed; }
        .feedback-status {
            font-size: 11px;
            text-align: center;
            color: var(--text-muted);
            min-height: 14px;
        }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

    <script>
        window.initialDropData = null;
        window.isAlreadyClaimed = false;

        function getQualityTier(q) {
            if (q >= 85) return { label: 'GODLY ROLL', color: '#f59e0b' };
            if (q >= 65) return { label: 'Insane roll', color: '#ec4899' };
            if (q >= 40) return { label: 'Solid roll', color: '#8b5cf6' };
            if (q >= 15) return { label: 'Mid roll', color: '#9ca3af' };
            return { label: 'Trash roll', color: '#6b7280' };
        }

        (function() {
            const CURRENT_VERSION = '5.5'; 
            const savedVersion = localStorage.getItem('app_version');

            if (savedVersion !== CURRENT_VERSION) {
                localStorage.removeItem('daily_drop_last_claim');
                localStorage.removeItem('drop_avatar');
                localStorage.removeItem('drop_rarity');
                localStorage.removeItem('drop_rarityClass');
                localStorage.removeItem('drop_base');
                localStorage.removeItem('drop_multiplier');
                localStorage.removeItem('drop_power');
                localStorage.removeItem('drop_quality');
                
                localStorage.setItem('app_version', CURRENT_VERSION);
            }

            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate === today) {
                window.isAlreadyClaimed = true;
                const avatar = localStorage.getItem('drop_avatar');
                const rarityText = localStorage.getItem('drop_rarity');
                const rarityClass = localStorage.getItem('drop_rarityClass');
                const base = localStorage.getItem('drop_base') || '0';
                const multiplier = localStorage.getItem('drop_multiplier') || '1.0';
                const power = localStorage.getItem('drop_power') || '0';
                const quality = localStorage.getItem('drop_quality') || '0';

                if (avatar && rarityText) {
                    window.initialDropData = { avatar, rarityText, rarityClass, base, multiplier, power, quality };
                }
            }
        })();
    </script>
</head>
<body>

    <div class="main-content">
        <div class="top-bar">
            <div class="app-title">Daily Catch</div>
            <div class="drop-rates">
                <span class="rate-badge legendary">👑 2%</span>
                <span class="rate-badge epic">🔮 8%</span>
                <span class="rate-badge rare">💎 25%</span>
            </div>
            <div class="icon-btn-group">
                <button class="sound-btn" id="feedbackBtn" onclick="openFeedback()" title="Feedback">✉️</button>
                <button class="sound-btn" id="soundToggle" onclick="toggleSound()" title="Toggle Sound">🔊</button>
            </div>
        </div>

        <!-- Big clicker: shown only before today's drop is opened -->
        <div class="clicker-box" id="clickerBox">
            <div class="clicker-target" id="clickTarget" onclick="handleLootClick(event)">
                <img src="lootbox.png" alt="Lootbox" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><circle cx='60' cy='60' r='50' fill='%238b5cf6'/><text x='60' y='68' text-anchor='middle' fill='white' font-size='38' font-weight='bold' style='font-family:sans-serif'>?</text></svg>'">
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="clicker-status" id="clickerStatus">Tap box to open drop!</div>
        </div>

        <!-- Compact bar: shown only after today's drop is claimed -->
        <div class="next-drop-bar hidden" id="nextDropBar">
            NEXT DROP IN <span id="nextDropTimer">00:00:00</span>
        </div>

        <!-- Result card: hidden until claimed -->
        <div class="card-container hidden" id="cardContainer">
            <div class="item-header">
                <script>
                    if (window.initialDropData) {
                        document.write(`<span class="rarity-tag ${window.initialDropData.rarityClass}" id="itemRarity">${window.initialDropData.rarityText}</span>`);
                        document.write(`<span class="multiplier-badge" id="multiplierBadge">⚡ x${window.initialDropData.multiplier} Mult</span>`);
                    } else {
                        document.write(`<span class="rarity-tag common" id="itemRarity">No Drop Yet</span>`);
                        document.write(`<span class="multiplier-badge" id="multiplierBadge">⚡ x1.0 Mult</span>`);
                    }
                </script>
            </div>
            
            <div class="item-box" id="itemDisplay">
                <script>
                    if (window.initialDropData) {
                        document.write(window.initialDropData.avatar);
                    } else {
                        document.write('<span class="empty-slot-text">Empty Slot</span>');
                    }
                </script>
            </div>

            <div class="quality-note" id="qualityNote">
                <script>
                    if (window.initialDropData) {
                        const q = Number(window.initialDropData.quality);
                        const t = getQualityTier(q);
                        document.write(`<span class="tier-label" style="color:${t.color}">${t.label}</span> <span class="tier-pct">(${q}%)</span>`);
                    } else {
                        document.write(`<span class="tier-pct">—</span>`);
                    }
                </script>
            </div>

            <div class="formula-breakdown" id="formulaBreakdown">
                <script>
                    if (window.initialDropData) {
                        document.write(`<span>Base:</span> ${Number(window.initialDropData.base).toLocaleString()} &nbsp;×&nbsp; <span>Mult:</span> ${window.initialDropData.multiplier}`);
                    } else {
                        document.write(`<span>Base:</span> 0 &nbsp;×&nbsp; <span>Mult:</span> 1.0`);
                    }
                </script>
            </div>

            <div class="power-box">
                <div class="power-label">Total Power Score</div>
                <div class="power-value" id="totalPower"><script>document.write(window.initialDropData ? Number(window.initialDropData.power).toLocaleString() : '0');</script></div>
            </div>

            <div class="card-footer-info">
                <span class="card-bot-link">t.me/Daily_Catch_Bot</span>
                <span class="card-watermark">Daily Drop</span>
            </div>
        </div>

        <button class="share-btn hidden" id="shareBtn" onclick="shareToTelegram()">📤 Share Drop</button>
    </div>

    <!-- Feedback modal -->
    <div class="feedback-overlay hidden" id="feedbackOverlay" onclick="closeFeedbackOnOverlay(event)">
        <div class="feedback-modal">
            <div class="feedback-title">Оставить фидбек</div>
            <textarea id="feedbackText" class="feedback-textarea" placeholder="Что улучшить, что бесит, что понравилось..." maxlength="1000"></textarea>
            <div class="feedback-actions">
                <button class="feedback-cancel" onclick="closeFeedback()">Отмена</button>
                <button class="feedback-send" id="feedbackSendBtn" onclick="sendFeedback()">Отправить</button>
            </div>
            <div class="feedback-status" id="feedbackStatus"></div>
        </div>
    </div>

    <script>
        let soundEnabled = true;
        let audioCtx = null;
        let clicksRemaining = 10;
        const totalClicksNeeded = 10;

        const RARITY_INFO = {
            common:    { min: 1000,  max: 4499   },
            rare:      { min: 5000,  max: 14999  },
            epic:      { min: 20000, max: 49999  },
            legendary: { min: 75000, max: 199999 }
        };

        const PALETTE = [
            { key: 'alt',  color: '139,92,246' },
            { key: 'on',   color: '236,72,153' },
            { key: 'cyan', color: '6,182,212'  },
            { key: 'gold', color: '245,158,11' }
        ];

        function weightsForQuality(q) {
            const low  = [50, 30, 15, 5];
            const high = [10, 25, 30, 35];
            return low.map((l, i) => l + (high[i] - l) * q);
        }

        function weightedPick(weights) {
            const total = weights.reduce((a, b) => a + b, 0);
            let r = Math.random() * total;
            for (let i = 0; i < weights.length; i++) {
                if (r < weights[i]) return i;
                r -= weights[i];
            }
            return weights.length - 1;
        }

        function generateAvatarForRarity(cssClass, basePower) {
            const info = RARITY_INFO[cssClass] || RARITY_INFO.common;
            let quality = (basePower - info.min) / (info.max - info.min);
            quality = Math.max(0, Math.min(1, quality));

            const weights = weightsForQuality(quality);
            const litChance = 0.25 + quality * 0.65;

            let html = '<div class="pixel-avatar">';
            for (let i = 0; i < 25; i++) {
                if (Math.random() < litChance) {
                    const idx = weightedPick(weights);
                    const { color } = PALETTE[idx];
                    const isGold = idx === 3;
                    const intensity = Math.min(1, 0.55 + quality * 0.4 + Math.random() * 0.1);
                    const glow = (isGold ? 6 : 3) + quality * 12;
                    html += `<div class="pixel" style="background: rgba(${color}, ${intensity.toFixed(2)}); box-shadow: 0 0 ${glow.toFixed(0)}px rgba(${color}, ${(intensity * 0.85).toFixed(2)});"></div>`;
                } else {
                    html += '<div class="pixel"></div>';
                }
            }
            html += '</div>';

            return { html, quality: Math.round(quality * 100) };
        }

        function rollRarity() {
            const rand = Math.random() * 100;
            if (rand < 2.0) {
                const base = Math.floor(Math.random() * 125000) + 75000;
                return { name: 'Legendary Apex', cssClass: 'legendary', basePower: base };
            } else if (rand < 10.0) {
                const base = Math.floor(Math.random() * 30000) + 20000;
                return { name: 'Epic Cyber Core', cssClass: 'epic', basePower: base };
            } else if (rand < 35.0) {
                const base = Math.floor(Math.random() * 10000) + 5000;
                return { name: 'Rare Quantum Item', cssClass: 'rare', basePower: base };
            } else {
                const base = Math.floor(Math.random() * 3500) + 1000;
                return { name: 'Common Drop', cssClass: 'common', basePower: base };
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playCrackSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }

        function playVictorySound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, index) => {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    gain.gain.setValueAtTime(0.12, now + index * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.07 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + index * 0.07);
                    osc.stop(now + index * 0.07 + 0.3);
                } catch(e) {}
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').innerText = soundEnabled ? '🔊' : '🔇';
        }

        function createParticleBurst(x, y) {
            const count = 22;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '7px';
                particle.style.height = '7px';
                particle.style.borderRadius = '50%';
                const colors = ['#ec4899', '#8b5cf6', '#38bdf8', '#f59e0b'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                particle.style.boxShadow = `0 0 8px ${particle.style.backgroundColor}`;
                document.body.appendChild(particle);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 90 + 25;
                const destinationX = Math.cos(angle) * speed;
                const destinationY = Math.sin(angle) * speed;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 350,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.isAlreadyClaimed) {
                showClaimedState();
                updateCountdown();
                setInterval(updateCountdown, 1000);
            } else {
                showUnclaimedState();
                updateProgressUI();
            }
        });

        function showUnclaimedState() {
            document.getElementById('clickerBox').classList.remove('hidden');
            document.getElementById('nextDropBar').classList.add('hidden');
            document.getElementById('cardContainer').classList.add('hidden');
            document.getElementById('shareBtn').classList.add('hidden');
        }

        function showClaimedState() {
            document.getElementById('clickerBox').classList.add('hidden');
            document.getElementById('nextDropBar').classList.remove('hidden');
            document.getElementById('cardContainer').classList.remove('hidden');
            document.getElementById('shareBtn').classList.remove('hidden');
        }

        function updateProgressUI() {
            const percentage = (clicksRemaining / totalClicksNeeded) * 100;
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('clickerStatus').innerText = `Tap box: ${clicksRemaining} left`;
        }

        function handleLootClick(event) {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();
            if (lastClaimDate === today || clicksRemaining <= 0) return;

            clicksRemaining--;
            playCrackSound();
            createParticleBurst(event.clientX, event.clientY);

            const target = document.getElementById('clickTarget');
            target.classList.remove('shake');
            void target.offsetWidth; 
            target.classList.add('shake');

            updateProgressUI();

            if (clicksRemaining === 0) {
                triggerSummon();
            }
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const text = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            const timerEl = document.getElementById('nextDropTimer');
            if (timerEl) timerEl.innerText = text;
        }

        function triggerSummon() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();
            if (lastClaimDate === today) return;

            playVictorySound();

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#8b5cf6', '#ec4899', '#f59e0b', '#38bdf8']
                });
            }

            const rolled = rollRarity();
            const { html: avatarHTML, quality } = generateAvatarForRarity(rolled.cssClass, rolled.basePower);

            const randomMultiplier = (Math.random() * 2.0 + 1.0).toFixed(1);
            const finalPower = Math.floor(rolled.basePower * parseFloat(randomMultiplier));

            document.getElementById('itemDisplay').innerHTML = avatarHTML;

            const tier = getQualityTier(quality);
            document.getElementById('qualityNote').innerHTML =
                `<span class="tier-label" style="color:${tier.color}">${tier.label}</span> <span class="tier-pct">(${quality}%)</span>`;

            const rarityTag = document.getElementById('itemRarity');
            rarityTag.innerText = rolled.name;
            rarityTag.className = `rarity-tag ${rolled.cssClass}`;
            
            document.getElementById('multiplierBadge').innerText = `⚡ x${randomMultiplier} Mult`;
            document.getElementById('formulaBreakdown').innerHTML = `<span>Base:</span> ${rolled.basePower.toLocaleString()} &nbsp;×&nbsp; <span>Mult:</span> ${randomMultiplier}`;
            document.getElementById('totalPower').innerText = finalPower.toLocaleString();

            localStorage.setItem('daily_drop_last_claim', today);
            localStorage.setItem('drop_avatar', avatarHTML);
            localStorage.setItem('drop_rarity', rolled.name);
            localStorage.setItem('drop_rarityClass', rolled.cssClass);
            localStorage.setItem('drop_base', rolled.basePower);
            localStorage.setItem('drop_multiplier', randomMultiplier);
            localStorage.setItem('drop_power', finalPower);
            localStorage.setItem('drop_quality', quality);

            showClaimedState();
            updateCountdown();
            setInterval(updateCountdown, 1000);

            const card = document.getElementById('cardContainer');
            card.classList.add('bounce-effect');
            setTimeout(() => card.classList.remove('bounce-effect'), 400);
        }

        async function shareToTelegram() {
            const lastClaimDate = localStorage.getItem('daily_drop_last_claim');
            const today = new Date().toDateString();

            if (lastClaimDate !== today) {
                alert('Open your drop first before sharing!');
                return;
            }

            const cardElement = document.querySelector('.card-container');
            const botUrl = 'https://t.me/Daily_Catch_Bot';

            try {
                const canvas = await html2canvas(cardElement, {
                    backgroundColor: '#070913',
                    scale: 2,
                    logging: false
                });

                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        alert('Failed to generate image.');
                        return;
                    }

                    const file = new File([blob], 'daily-drop.png', { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({ files: [file] });
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.log('Share error:', err);
                            }
                        }
                    } else {
                        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                            window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(botUrl)}`);
                        } else {
                            alert('Sharing images as files is not supported on this device/browser.');
                        }
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Screenshot error:', error);
                alert('Could not create drop image.');
            }
        }

        // ---------- Feedback form ----------

        const FEEDBACK_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxJ71sXGei4ntm4HcpOGroiVJ-t-1PffTxS5LG_SBu0Bz37qVYRhc10EQmJnEKtvvx4/exec';
        const FEEDBACK_COOLDOWN_MS = 3 * 60 * 1000; // 3 minutes — mirrors the server-side cooldown
        let feedbackCooldownInterval = null;

        function getFeedbackCooldownRemaining() {
            const last = parseInt(localStorage.getItem('feedback_last_sent') || '0', 10);
            return Math.max(0, FEEDBACK_COOLDOWN_MS - (Date.now() - last));
        }

        function updateFeedbackButtonState() {
            const btn = document.getElementById('feedbackSendBtn');
            const status = document.getElementById('feedbackStatus');
            const remaining = getFeedbackCooldownRemaining();

            if (remaining > 0) {
                btn.disabled = true;
                const secs = Math.ceil(remaining / 1000);
                status.innerText = `Можно отправить ещё раз через ${secs}с`;
            } else {
                btn.disabled = false;
                if (status.innerText.startsWith('Можно отправить')) status.innerText = '';
                if (feedbackCooldownInterval) {
                    clearInterval(feedbackCooldownInterval);
                    feedbackCooldownInterval = null;
                }
            }
        }

        function openFeedback() {
            document.getElementById('feedbackOverlay').classList.remove('hidden');
            updateFeedbackButtonState();
            if (getFeedbackCooldownRemaining() > 0 && !feedbackCooldownInterval) {
                feedbackCooldownInterval = setInterval(updateFeedbackButtonState, 1000);
            }
        }

        function closeFeedback() {
            document.getElementById('feedbackOverlay').classList.add('hidden');
            if (feedbackCooldownInterval) {
                clearInterval(feedbackCooldownInterval);
                feedbackCooldownInterval = null;
            }
        }

        function closeFeedbackOnOverlay(e) {
            if (e.target.id === 'feedbackOverlay') closeFeedback();
        }

        async function sendFeedback() {
			const textEl = document.getElementById('feedbackText');
			const message = textEl.value.trim();
			const status = document.getElementById('feedbackStatus');

			if (message.length < 3) {
				status.innerText = 'Напиши чуть подробнее :)';
				return;
			}
			if (getFeedbackCooldownRemaining() > 0) {
				updateFeedbackButtonState();
				return;
			}

			const btn = document.getElementById('feedbackSendBtn');
			btn.disabled = true;
			status.innerText = 'Отправляю...';

			// Raw signed string Telegram itself generated on launch — this is what gets verified server-side
			const initData = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || '';

			try {
				await fetch(FEEDBACK_ENDPOINT, {
					method: 'POST',
					mode: 'no-cors',
					body: JSON.stringify({ message, initData })
				});

				localStorage.setItem('feedback_last_sent', String(Date.now()));
				status.innerText = 'Спасибо! Отправлено ✅';
				textEl.value = '';
				setTimeout(closeFeedback, 900);
			} catch (err) {
				status.innerText = 'Ошибка отправки, попробуй ещё раз';
				btn.disabled = false;
			}
		}
    </script>
